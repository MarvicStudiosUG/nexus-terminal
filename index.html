<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <title>Nexus Terminal Pro</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; background:#080c14; color:#e0e8ff; font-family:monospace; }

    .terminal {
      display:flex;
      flex-direction:column;
      height:100vh;
      width:100vw;
      background:#0a1225;
      position:relative;
    }

    /* HEADER */
    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 16px;
      background:#0a0f1a;
      border-bottom:1px solid #00ffcc;
      flex-shrink:0;
      min-height:50px;
    }
    .dots { display:flex; gap:8px; }
    .dot { width:12px; height:12px; border-radius:50%; }
    .dot.red { background:#ff5f57; }
    .dot.yellow { background:#febc2e; }
    .dot.green { background:#28c840; }
    .title { color:#00ffcc; font-weight:bold; font-size:0.9rem; }
    .status { display:flex; gap:12px; font-size:0.7rem; align-items:center; }
    .led { display:inline-block; width:8px; height:8px; background:#4cff8f; border-radius:50%; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* SETTINGS PANEL */
    .settings-panel {
      display:none;
      position:absolute;
      top:55px;
      right:10px;
      background:#0a1225;
      border:1px solid #00ffcc;
      border-radius:8px;
      padding:16px;
      width:260px;
      z-index:10;
    }
    .settings-panel.active { display:block; }
    .settings-section { margin-bottom:12px; }
    .settings-section h3 { color:#00ffcc; font-size:0.8rem; margin-bottom:4px; }
    select, input[type="range"], #aliasInput {
      width:100%;
      background:#111;
      border:1px solid #00ffcc;
      color:#e0e8ff;
      padding:6px;
      border-radius:4px;
      font-family:monospace;
    }
    #aliasAddBtn {
      width:100%;
      background:#00ffcc;
      border:none;
      color:#000;
      font-weight:bold;
      padding:6px;
      border-radius:4px;
      cursor:pointer;
      margin-top:4px;
    }

    /* BODY */
    .body {
      display:flex;
      flex-direction:column;
      flex:1;
      overflow:hidden;
    }

    /* OUTPUT */
    .output {
      flex:1;
      overflow-y:auto;
      padding:12px 16px;
      background:#050a12;
      line-height:1.6;
      font-size:0.85rem;
    }
    .output::-webkit-scrollbar { width:6px; }
    .output::-webkit-scrollbar-thumb { background:#00ffcc; border-radius:10px; }
    .line { margin-bottom:4px; animation:fadeIn 0.2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }
    .cmd { color:#00ffcc; font-weight:bold; }
    .cmd::before { content:"> "; opacity:0.6; }
    .err { color:#ff5370; }
    .ok { color:#4cff8f; }
    .info { color:#6b7f99; }
    .highlight { color:#00ffcc; font-weight:bold; }
    .block {
      background:rgba(0,255,200,0.05);
      border-left:3px solid #00ffcc;
      padding:8px 12px;
      margin:6px 0;
    }
    .clickable-cmd {
      cursor:pointer;
      color:#00ffcc;
      text-decoration:underline dotted;
      margin-right:12px;
    }
    .clickable-cmd:hover { color:#fff; }

    /* QUICKBAR */
    .quickbar {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      padding:6px 16px;
      border-top:1px solid #00ffcc;
      background:#0a0f1a;
      flex-shrink:0;
      overflow-x:auto;
    }
    .quickbar::-webkit-scrollbar { height:4px; }
    .quickbar::-webkit-scrollbar-thumb { background:#00ffcc; border-radius:10px; }
    .qbtn {
      background:rgba(0,255,200,0.1);
      border:1px solid rgba(0,255,200,0.3);
      color:#00ffcc;
      padding:4px 12px;
      border-radius:20px;
      font-size:0.7rem;
      cursor:pointer;
      white-space:nowrap;
    }
    .qbtn:hover { background:rgba(0,255,200,0.2); }

    /* INPUT LINE */
    .inputline {
      display:flex;
      padding:8px 16px;
      border-top:1px solid #00ffcc;
      background:#0a0f1a;
      flex-shrink:0;
    }
    .prompt { color:#00ffcc; font-weight:bold; margin-right:8px; }
    #cmdInput {
      flex:1;
      background:none;
      border:none;
      color:#e0e8ff;
      font-family:monospace;
      font-size:0.9rem;
      outline:none;
    }
    #cmdInput::placeholder { color:rgba(255,255,255,0.2); }
    .input-actions { display:flex; gap:6px; align-items:center; }
    #execBtn {
      background:#00ffcc;
      border:none;
      color:#050810;
      font-weight:bold;
      padding:6px 16px;
      border-radius:20px;
      cursor:pointer;
      font-size:0.7rem;
    }
    #execBtn:hover { box-shadow:0 0 20px rgba(0,255,200,0.5); }
    .icon-btn {
      background:rgba(0,255,200,0.05);
      border:1px solid #00ffcc;
      color:#6b7f99;
      width:32px;
      height:32px;
      border-radius:50%;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .icon-btn:hover { color:#00ffcc; }

    /* DROP OVERLAY */
    .drop-overlay {
      display:none;
      position:absolute;
      inset:0;
      background:rgba(0,255,200,0.1);
      border:3px dashed #00ffcc;
      align-items:center;
      justify-content:center;
      color:#00ffcc;
      font-size:1.2rem;
      font-weight:bold;
      z-index:50;
      pointer-events:none;
    }
    .drop-overlay.active { display:flex; }

    /* Mobile */
    @media (max-width:600px) {
      .header { padding:4px 8px; }
      .title { font-size:0.7rem; }
      .status { font-size:0.6rem; gap:6px; }
      .output { padding:6px 8px; font-size:0.75rem; }
      .quickbar { padding:4px 8px; gap:4px; }
      .qbtn { padding:2px 8px; font-size:0.6rem; }
      .inputline { padding:4px 8px; }
      #cmdInput { font-size:0.8rem; }
      #execBtn { padding:4px 12px; font-size:0.6rem; }
      .settings-panel { width:200px; right:4px; top:45px; padding:8px; }
    }
  </style>
</head>
<body>
  <div class="terminal" id="app">
    <div class="drop-overlay" id="dropOverlay">DROP FILES HERE</div>

    <div class="header">
      <div class="dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="title">NEXUS TERMINAL PRO</div>
      <div class="status">
        <span><span class="led"></span> ONLINE</span>
        <span id="liveClock">--:--:--</span>
        <button class="settings-btn" id="settingsToggle">Settings</button>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-section">
        <h3>Theme</h3>
        <select id="themeSelect">
          <option value="default">Cyber Neon</option>
          <option value="ocean">Deep Ocean</option>
          <option value="mono">Monochrome</option>
          <option value="matrix">Matrix</option>
          <option value="sunset">Sunset</option>
        </select>
      </div>
      <div class="settings-section">
        <h3>Font Size</h3>
        <input type="range" id="fontSizeSlider" min="11" max="18" value="14">
        <span id="fontSizeValue" style="color:#6b7f99;">14px</span>
      </div>
      <div class="settings-section">
        <h3>Command Aliases</h3>
        <input type="text" id="aliasInput" placeholder="alias=command">
        <button id="aliasAddBtn">Add Alias</button>
      </div>
      <div class="settings-section">
        <h3>Session Stats</h3>
        <div style="font-size:0.7rem;color:#6b7f99;" id="sessionStats"></div>
      </div>
      <div style="margin-top:1rem;font-size:0.7rem;color:#6b7f99;text-align:center;">
        Nexus Terminal Pro v4.4<br>Marvic Studios UG
      </div>
    </div>

    <div class="body">
      <div class="output" id="outputContainer"></div>
      <div class="quickbar" id="quickbar"></div>
      <div class="inputline">
        <div class="prompt"><span>></span></div>
        <input type="text" id="cmdInput" placeholder="type command..." autofocus autocomplete="off" spellcheck="false">
        <div class="input-actions">
          <button class="icon-btn" id="clearBtn" title="Clear (Ctrl+L)">&#x2715;</button>
          <button id="execBtn">EXEC</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================================
      //  STATE
      // ============================================================
      const output = document.getElementById('outputContainer');
      const input = document.getElementById('cmdInput');
      const execBtn = document.getElementById('execBtn');
      const clockEl = document.getElementById('liveClock');
      const settingsPanel = document.getElementById('settingsPanel');
      const themeSelect = document.getElementById('themeSelect');
      const sessionStats = document.getElementById('sessionStats');
      const quickbar = document.getElementById('quickbar');
      const dropOverlay = document.getElementById('dropOverlay');
      const aliasInput = document.getElementById('aliasInput');
      const aliasAddBtn = document.getElementById('aliasAddBtn');
      const fontSizeSlider = document.getElementById('fontSizeSlider');

      let history = JSON.parse(localStorage.getItem('nexus_history') || '[]');
      let histIdx = history.length;
      let vaultPassword = null;
      let sessionCommands = 0;
      let sessionStart = Date.now();
      let cmdFrequency = JSON.parse(localStorage.getItem('nexus_cmdfreq') || '{}');
      let commandCount = 0;
      let aliases = JSON.parse(localStorage.getItem('nexus_aliases') || '{}');
      let outputLines = [];
      const MAX_OUTPUT_LINES = 500;

      // ============================================================
      //  UTILITY
      // ============================================================
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function(m) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m];
        });
      }

      function add(html, cls) {
        cls = cls || '';
        const line = document.createElement('div');
        line.className = 'line ' + cls;
        line.innerHTML = html;
        output.appendChild(line);
        outputLines.push(line);
        if (outputLines.length > MAX_OUTPUT_LINES) {
          const removed = outputLines.shift();
          if (removed && removed.parentNode) removed.parentNode.removeChild(removed);
        }
        output.scrollTop = output.scrollHeight;
        return line;
      }

      function cmdEcho(t) {
        add('<span class="cmd">' + esc(t) + '</span>');
      }

      function loader(msg) {
        const id = 'l' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        add('<span id="' + id + '" class="info">[...] ' + esc(msg) + '</span>');
        return id;
      }

      function unloader(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
      }

      function updateStats() {
        const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        sessionStats.textContent = 'Commands: ' + sessionCommands + ' | Session: ' + mins + 'm ' + secs + 's';
      }

      function tick() {
        clockEl.textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
        updateStats();
      }
      setInterval(tick, 1000);
      tick();

      function updateQuickbar() {
        const sorted = Object.entries(cmdFrequency).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 8);
        quickbar.innerHTML = '';
        sorted.forEach(function(entry) {
          const cmd = entry[0];
          const btn = document.createElement('button');
          btn.className = 'qbtn';
          btn.dataset.cmd = cmd;
          btn.textContent = cmd;
          btn.addEventListener('click', function() {
            execute(cmd);
            input.focus();
          });
          quickbar.appendChild(btn);
        });
      }

      function recordCmd(cmd) {
        if (!cmdFrequency[cmd]) cmdFrequency[cmd] = 0;
        cmdFrequency[cmd]++;
        localStorage.setItem('nexus_cmdfreq', JSON.stringify(cmdFrequency));
        commandCount++;
        if (commandCount % 5 === 0) updateQuickbar();
      }

      // ============================================================
      //  THEME
      // ============================================================
      var themes = {
        default: { cyan: '#00ffcc', blue: '#0088ff', thumb: '#00ffcc', bg: '#080c14' },
        ocean: { cyan: '#4dc9f6', blue: '#0277bd', thumb: '#4dc9f6', bg: '#0a1628' },
        mono: { cyan: '#aaaaaa', blue: '#666666', thumb: '#aaaaaa', bg: '#0a0a0a' },
        matrix: { cyan: '#00ff41', blue: '#008f11', thumb: '#00ff41', bg: '#0a0f0a' },
        sunset: { cyan: '#ff6b6b', blue: '#ee5a24', thumb: '#ff6b6b', bg: '#1a0a0a' }
      };

      function applyTheme(name) {
        var t = themes[name] || themes.default;
        var r = document.documentElement;
        r.style.setProperty('--neon-cyan', t.cyan);
        r.style.setProperty('--neon-blue', t.blue);
        r.style.setProperty('--scroll-thumb', t.thumb);
        r.style.setProperty('--bg-deep', t.bg);
        localStorage.setItem('nexus_theme', name);
        themeSelect.value = name;
      }

      // ============================================================
      //  SAFE CALC (no eval)
      // ============================================================
      function safeCalc(expr) {
        expr = expr.replace(/\s/g, '');
        if (!/^[0-9+\-*/().%]+$/.test(expr)) {
          throw new Error('Invalid characters');
        }
        var tokens = [];
        var i = 0;
        while (i < expr.length) {
          var ch = expr[i];
          if (ch >= '0' && ch <= '9') {
            var num = '';
            while (i < expr.length && ((expr[i] >= '0' && expr[i] <= '9') || expr[i] === '.')) {
              num += expr[i];
              i++;
            }
            tokens.push({ type: 'num', value: parseFloat(num) });
          } else if (ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '(' || ch === ')' || ch === '%') {
            tokens.push({ type: 'op', value: ch });
            i++;
          } else {
            throw new Error('Unexpected character: ' + ch);
          }
        }

        function parseExpr(pos) {
          var result = parseTerm(pos);
          var p = result.pos;
          while (p < tokens.length && (tokens[p].value === '+' || tokens[p].value === '-')) {
            var op = tokens[p].value;
            p++;
            var right = parseTerm(p);
            p = right.pos;
            if (op === '+') result.value += right.value;
            else result.value -= right.value;
          }
          return { value: result.value, pos: p };
        }

        function parseTerm(pos) {
          var result = parseFactor(pos);
          var p = result.pos;
          while (p < tokens.length && (tokens[p].value === '*' || tokens[p].value === '/' || tokens[p].value === '%')) {
            var op = tokens[p].value;
            p++;
            var right = parseFactor(p);
            p = right.pos;
            if (op === '*') result.value *= right.value;
            else if (op === '/') {
              if (right.value === 0) throw new Error('Division by zero');
              result.value /= right.value;
            } else if (op === '%') {
              if (right.value === 0) throw new Error('Modulo by zero');
              result.value %= right.value;
            }
          }
          return { value: result.value, pos: p };
        }

        function parseFactor(pos) {
          if (pos >= tokens.length) throw new Error('Unexpected end of expression');
          if (tokens[pos].type === 'num') {
            return { value: tokens[pos].value, pos: pos + 1 };
          }
          if (tokens[pos].value === '(') {
            var inner = parseExpr(pos + 1);
            if (inner.pos >= tokens.length || tokens[inner.pos].value !== ')') {
              throw new Error('Missing closing parenthesis');
            }
            return { value: inner.value, pos: inner.pos + 1 };
          }
          if (tokens[pos].value === '-') {
            var factor = parseFactor(pos + 1);
            return { value: -factor.value, pos: factor.pos };
          }
          throw new Error('Unexpected token: ' + tokens[pos].value);
        }

        var result = parseExpr(0);
        if (result.pos !== tokens.length) {
          throw new Error('Unexpected tokens after expression');
        }
        if (!isFinite(result.value) || isNaN(result.value)) {
          throw new Error('Invalid result');
        }
        return result.value;
      }

      // ============================================================
      //  VAULT (simple XOR – for demo; use Web Crypto in production)
      // ============================================================
      function getVaultData() { return JSON.parse(localStorage.getItem('nexus_vault2') || '[]'); }

      function setVaultData(data) { localStorage.setItem('nexus_vault2', JSON.stringify(data)); }

      function simpleEncrypt(text, password) {
        var cipher = '';
        for (var i = 0; i < text.length; i++) {
          cipher += String.fromCharCode(text.charCodeAt(i) ^ password.charCodeAt(i % password.length));
        }
        return btoa(cipher);
      }

      function simpleDecrypt(cipher, password) {
        var decoded = atob(cipher);
        var text = '';
        for (var i = 0; i < decoded.length; i++) {
          text += String.fromCharCode(decoded.charCodeAt(i) ^ password.charCodeAt(i % password.length));
        }
        return text;
      }

      function vaultSetPassword(password) {
        if (!password || password.length < 4) { add('Password too short (min 4).', 'err'); return; }
        vaultPassword = password;
        localStorage.setItem('nexus_vault_pass', password);
        add('Vault password set.', 'ok');
      }

      function vaultUnlock(password) {
        var stored = localStorage.getItem('nexus_vault_pass');
        if (!stored) { add('No vault password set.', 'err'); return false; }
        if (password !== stored) { add('Wrong password.', 'err'); return false; }
        vaultPassword = password;
        add('Vault unlocked.', 'ok');
        return true;
      }

      function vaultAdd(text) {
        if (!vaultPassword) { add('Vault locked.', 'err'); return; }
        var entry = simpleEncrypt(text, vaultPassword);
        var data = getVaultData();
        data.push({ cipher: entry, time: Date.now() });
        setVaultData(data);
        add('Added to vault.', 'ok');
      }

      function vaultList() {
        if (!vaultPassword) { add('Vault locked.', 'err'); return; }
        var data = getVaultData();
        if (!data.length) { add('Vault empty.', 'info'); return; }
        add('<strong>Vault entries:</strong>', 'highlight');
        data.forEach(function(entry, i) {
          try {
            var decrypted = simpleDecrypt(entry.cipher, vaultPassword);
            var date = new Date(entry.time).toLocaleString();
            add('#' + (i + 1) + ' [' + date + '] ' + esc(decrypted), 'ok');
          } catch { add('#' + (i + 1) + ': Decryption failed', 'err'); }
        });
      }

      function vaultDelete(index) {
        if (!vaultPassword) { add('Vault locked.', 'err'); return; }
        var data = getVaultData();
        if (index < 1 || index > data.length) { add('Invalid index.', 'err'); return; }
        data.splice(index - 1, 1);
        setVaultData(data);
        add('Entry deleted.', 'ok');
      }

      function vaultLock() { vaultPassword = null;
        add('Vault locked.', 'ok'); }
      (function() {
        var saved = localStorage.getItem('nexus_vault_pass');
        if (saved) vaultPassword = saved;
      })();

      // ============================================================
      //  FS
      // ============================================================
      function fsList() {
        var files = JSON.parse(localStorage.getItem('nexus_fs') || '{}');
        var names = Object.keys(files);
        if (!names.length) { add('FS empty.', 'info'); } else { names.forEach(function(n) { add(esc(n) + ' (' + files[n]
                .length + ' bytes)', 'ok'); }); }
      }

      function fsSanitize(name) {
        if (!name || typeof name !== 'string') return null;
        if (name.includes('..') || name.includes('/') || name.includes('\\')) return null;
        return name.replace(/[^a-zA-Z0-9_\-\.]/g, '');
      }

      function fsCreate(name, content) {
        var safe = fsSanitize(name);
        if (!safe) { add('Invalid filename.', 'err'); return; }
        var f = JSON.parse(localStorage.getItem('nexus_fs') || '{}');
        if (f[safe]) { add('File exists.', 'err'); return; }
        f[safe] = String(content || '');
        localStorage.setItem('nexus_fs', JSON.stringify(f));
        add('Created "' + esc(safe) + '".', 'ok');
      }

      function fsRead(name) {
        var safe = fsSanitize(name);
        if (!safe) { add('Invalid filename.', 'err'); return; }
        var f = JSON.parse(localStorage.getItem('nexus_fs') || '{}');
        if (!f[safe]) { add('File not found.', 'err'); return; }
        add('<div class="block"><strong>' + esc(safe) + '</strong><br>' + esc(f[safe]) + '</div>', 'ok');
      }

      function fsDelete(name) {
        var safe = fsSanitize(name);
        if (!safe) { add('Invalid filename.', 'err'); return; }
        var f = JSON.parse(localStorage.getItem('nexus_fs') || '{}');
        if (!f[safe]) { add('File not found.', 'err'); return; }
        delete f[safe];
        localStorage.setItem('nexus_fs', JSON.stringify(f));
        add('Deleted "' + esc(safe) + '".', 'ok');
      }

      function fsSearch(query) {
        if (!query) { add('Usage: fs search <query>', 'err'); return; }
        var f = JSON.parse(localStorage.getItem('nexus_fs') || '{}');
        var results = [];
        Object.keys(f).forEach(function(name) {
          if (name.includes(query) || f[name].includes(query)) results.push(name);
        });
        if (!results.length) { add('No matches.', 'info'); } else { add('<strong>Search results:</strong>', 'highlight');
          results.forEach(function(n) { add(esc(n), 'ok'); }); }
      }

      // ============================================================
      //  ALIAS
      // ============================================================
      function addAlias(alias, command) {
        if (!alias || !command) { add('Usage: alias <name> <command>', 'err'); return; }
        alias = alias.trim();
        command = command.trim();
        if (alias.includes(' ') || alias.includes('=')) { add('Alias cannot contain spaces or equals.', 'err'); return; }
        aliases[alias] = command;
        localStorage.setItem('nexus_aliases', JSON.stringify(aliases));
        add('Alias "' + esc(alias) + '" -> "' + esc(command) + '"', 'ok');
      }

      function listAliases() {
        var keys = Object.keys(aliases);
        if (!keys.length) { add('No aliases defined.', 'info'); return; }
        add('<strong>Aliases:</strong>', 'highlight');
        keys.forEach(function(k) { add(esc(k) + ' = ' + esc(aliases[k]), 'ok'); });
      }

      function removeAlias(alias) {
        alias = alias.trim();
        if (!aliases[alias]) { add('Alias not found.', 'err'); return; }
        delete aliases[alias];
        localStorage.setItem('nexus_aliases', JSON.stringify(aliases));
        add('Alias "' + esc(alias) + '" removed.', 'ok');
      }

      function resolveAlias(cmd) {
        var parts = cmd.trim().split(/\s+/);
        var first = parts[0];
        if (aliases[first]) {
          var rest = parts.slice(1).join(' ');
          return aliases[first] + (rest ? ' ' + rest : '');
        }
        return cmd;
      }

      // ============================================================
      //  API (cached)
      // ============================================================
      var apiCache = new Map();

      function cacheGet(key) {
        var entry = apiCache.get(key);
        if (!entry) return null;
        if (Date.now() > entry.expiry) { apiCache.delete(key); return null; }
        return entry.data;
      }

          if (data.type === 'disambiguation') { unloader(lid);
            add('Disambiguation page.', 'warning'); return; }
          var result = { title: data.title, extract: data.extract || '' };
          cacheSet(key, result, 3600000);
          unloader(lid);
          add('<div class="block"><strong>' + esc(data.title) + '</strong><br>' + esc((data.extract || '')
              .substring(0, 400)) + '...</div>', 'ok');
        } catch { unloader(lid);
          add('Wikipedia error.', 'err'); }
      }

      async function defineWord(word) {
        var key = 'define_' + word;
        var cached = cacheGet(key);
        if (cached) {
          add('<strong>' + esc(cached.word) + '</strong> (' + esc(cached.phonetic || '') + ')', 'highlight');
          cached.meanings.forEach(function(meaning) {
            add('<em>' + esc(meaning.partOfSpeech) + '</em>', 'info');
            meaning.definitions.slice(0, 3).forEach(function(def) {
              add('- ' + esc(def.definition), 'ok');
            });
          });
          return;
        }
        var lid = loader('Define: ' + word + '...');
        try {
          var res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(
            word));
          var data = await res.json();
          if (data.title === 'No Definitions Found') { unloader(lid);
            add('No definition.', 'info'); return; }
          var entry = data[0];
          cacheSet(key, entry, 3600000);
          unloader(lid);
          add('<strong>' + esc(entry.word) + '</strong> (' + esc(entry.phonetic || '') + ')', 'highlight');
          entry.meanings.forEach(function(meaning) {
            add('<em>' + esc(meaning.partOfSpeech) + '</em>', 'info');
            meaning.definitions.slice(0, 3).forEach(function(def) {
              add('- ' + esc(def.definition), 'ok');
            });
          });
        } catch { unloader(lid);
          add('Dictionary error.', 'err'); }
      }

      function qrCode(text) {
        if (!text) { add('Usage: qr <text>', 'err'); return; }
        var url = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(text);
        add('<img src="' + url +
          '" alt="QR Code" style="display:block;margin:0.5rem 0;border:2px solid var(--neon-cyan);border-radius:8px;">',
          'ok');
      }

      async function randomUser() {
        var key = 'randomuser';
        var cached = cacheGet(key);
        if (cached) {
          var u = cached;
          add('<div class="block"><strong>' + esc(u.name.first) + ' ' + esc(u.name.last) +
            '</strong><br>Email: ' + esc(u.email) + '<br>Location: ' + esc(u.location.city) + ', ' +
            esc(u.location.country) + '</div>', 'ok');
          return;
        }
        var lid = loader('Random user...');
        try {
          var res = await fetch('https://randomuser.me/api/');
          var data = await res.json();
          var u2 = data.results[0];
          cacheSet(key, u2, 600000);
          unloader(lid);
          add('<div class="block"><strong>' + esc(u2.name.first) + ' ' + esc(u2.name.last) +
            '</strong><br>Email: ' + esc(u2.email) + '<br>Location: ' + esc(u2.location.city) + ', ' +
            esc(u2.location.country) + '</div>', 'ok');
        } catch { unloader(lid);
          add('Random user error.', 'err'); }
      }

      async function boredActivity() {
        var key = 'bored';
        var cached = cacheGet(key);
        if (cached) {
          add('<div class="block"><strong>Activity:</strong> ' + esc(cached.activity) + '<br>Type: ' +
            esc(cached.type) + ' | Participants: ' + cached.participants + '</div>', 'ok');
          return;
        }
        var lid = loader('Activity...');
        try {
          var res = await fetch('https://www.boredapi.com/api/activity');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var data = await res.json();
          cacheSet(key, data, 600000);
          unloader(lid);
          add('<div class="block"><strong>Activity:</strong> ' + esc(data.activity) + '<br>Type: ' + esc(
              data.type) + ' | Participants: ' + data.participants + '</div>', 'ok');
        } catch (e) { unloader(lid);
          add('Activity error: ' + esc(e.message), 'err'); }
      }

      async function catFact() {
        var key = 'catfact';
        var cached = cacheGet(key);
        if (cached) { add('<div class="block">' + esc(cached) + '</div>', 'ok'); return; }
        var lid = loader('Cat fact...');
        try {
          var res = await fetch('https://catfact.ninja/fact');
          var data = await res.json();
          cacheSet(key, data.fact, 600000);
          unloader(lid);
          add('<div class="block">' + esc(data.fact) + '</div>', 'ok');
        } catch { unloader(lid);
          add('Cat fact error.', 'err'); }
      }

      async function dogImage() {
        var key = 'dog';
        var cached = cacheGet(key);
        if (cached) {
          add('<img src="' + cached +
            '" alt="Dog" style="max-width:300px;border:2px solid var(--neon-cyan);border-radius:8px;margin-top:0.5rem;">',
            'ok');
          return;
        }
        var lid = loader('Dog image...');
        try {
          var res = await fetch('https://dog.ceo/api/breeds/image/random');
          var data = await res.json();
          cacheSet(key, data.message, 600000);
          unloader(lid);
          add('<img src="' + data.message +
            '" alt="Dog" style="max-width:300px;border:2px solid var(--neon-cyan);border-radius:8px;margin-top:0.5rem;">',
            'ok');
        } catch { unloader(lid);
          add('Dog image error.', 'err'); }
      }

      function worldClock() {
        var zones = [{ n: 'New York', tz: 'America/New_York' }, { n: 'London', tz: 'Europe/London' },
        { n: 'Tokyo', tz: 'Asia/Tokyo' }, { n: 'Dubai', tz: 'Asia/Dubai' }, { n: 'Sydney', tz: 'Australia/Sydney' }];
        add('<strong>World Clock:</strong>', 'highlight');
        zones.forEach(function(z) {
          add(z.n + ': ' + new Date().toLocaleTimeString('en-US', { timeZone: z.tz, hour12: true }),
            'ok');
        });
      }

      function genPass(length) {
        length = Math.min(parseInt(length) || 12, 50);
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()';
        var pass = '';
        for (var i = 0; i < length; i++) pass += chars[Math.floor(Math.random() * chars.length)];
        add('Generated password: ' + esc(pass), 'ok');
      }

      function reverseText(text) { add('Reversed: ' + esc(text.split('').reverse().join('')), 'ok'); }

      function upperText(text) { add('UPPER: ' + esc(text.toUpperCase()), 'ok'); }

      function lowerText(text) { add('lower: ' + esc(text.toLowerCase()), 'ok'); }

      function lenText(text) { add('Length: ' + text.length, 'ok'); }

      function echoText(text) { add(esc(text), 'ok'); }

      // ============================================================
      //  EXECUTE
      // ============================================================
      async function execute(raw) {
        if (!raw || !raw.trim()) return;
        var resolved = resolveAlias(raw.trim());
        if (resolved !== raw.trim()) { add('(alias) ' + esc(resolved), 'info'); }
        var parts = resolved.trim().split(/\s+/);
        var main = parts[0].toLowerCase();
        var args = parts.slice(1);

        cmdEcho(resolved);
        history.push(resolved);
        histIdx = history.length;
        if (history.length > 200) history = history.slice(-200);
        localStorage.setItem('nexus_history', JSON.stringify(history));
        recordCmd(main);
        sessionCommands++;

        switch (main) {
          case 'help':
            add('<strong>=== All Commands (click to load) ===</strong>', 'highlight');
            var cmds = [
              ['WEATHER <city>', 'weather'],
              ['JOKE [count]', 'joke'],
              ['CRYPTO [coins]', 'crypto'],
              ['NEWS', 'news'],
              ['IP', 'ip'],
              ['DNS <domain>', 'dns'],
              ['CURRENCY <from> <to> [amount]', 'currency'],
              ['GITHUB <user>', 'github'],
              ['SPACEX', 'spacex'],
              ['QUOTE', 'quote'],
              ['SPORTS schedule <league>', 'sports schedule'],
              ['SPORTS scores <league>', 'sports scores'],
              ['SPORTS table <league>', 'sports table'],
              ['SPORTS team <name>', 'sports team'],
              ['GAMES deals', 'games deals'],
              ['TIME', 'time'],
              ['DATE', 'date'],
              ['CALC <expression>', 'calc'],
              ['GENPASS [length]', 'genpass'],
              ['REVERSE <text>', 'reverse'],
              ['UPPER <text>', 'upper'],
              ['LOWER <text>', 'lower'],
              ['LEN <text>', 'len'],
              ['ECHO <text>', 'echo'],
              ['FACT', 'fact'],
              ['WIKI <term>', 'wiki'],
              ['DEFINE <word>', 'define'],
              ['QR <text>', 'qr'],
              ['RANDOMUSER', 'randomuser'],
              ['BORED', 'bored'],
              ['CATFACT', 'catfact'],
              ['DOG', 'dog'],
              ['REDDIT <subreddit> [limit]', 'reddit'],
              ['STOCKS <symbol>', 'stocks'],
              ['TRANSLATE <text> <target>', 'translate'],
              ['FS ls|create|read|delete|search', 'fs'],
              ['VAULT setpass|unlock|add|list|delete|lock', 'vault'],
              ['ALIAS <name> <command>', 'alias'],
              ['ALIAS list', 'alias list'],
              ['ALIAS remove <name>', 'alias remove'],
              ['THEME <name>', 'theme'],
              ['CACHE clear', 'cache clear'],
              ['CLEAR', 'clear'],
              ['ABOUT', 'about']
            ];
            cmds.forEach(function(item) {
              add('<span class="clickable-cmd" data-cmd="' + esc(item[1]) + '">' + esc(item[0]) +
                '</span>', 'info');
            });
            break;
          case 'weather':
            if (!args[0]) add('Usage: weather <city>', 'err');
            else await weather(args.join(' '));
            break;
          case 'joke':
            await joke(args[0] ? Math.min(parseInt(args[0]), 10) : 1);
            break;
          case 'crypto':
            await crypto(args.join(',') || 'bitcoin,ethereum');
            break;
          case 'news':
            await news();
            break;
          case 'ip':
            await ipInfo();
            break;
          case 'dns':
            if (!args[0]) add('Usage: dns <domain>', 'err');
            else await dnsLookup(args[0]);
            break;
          case 'currency':
            await currency(args[0] || 'USD', args[1] || 'EUR', args[2] ? parseFloat(args[2]) : 1);
            break;
          case 'github':
            if (!args[0]) add('Usage: github <user>', 'err');
            else await github(args[0]);
            break;
          case 'spacex':
            await spacex();
            break;
          case 'quote':
            await quote();
            break;
          case 'sports':
            if (args[0] === 'schedule' && args[1]) await sportsSchedule(args.slice(1).join(' '));
            else if (args[0] === 'scores' && args[1]) await sportsScores(args.slice(1).join(' '));
            else if (args[0] === 'table' && args[1]) await sportsTable(args.slice(1).join(' '));
            else if (args[0] === 'team' && args[1]) await sportsTeam(args.slice(1).join(' '));
            else add('Usage: sports <schedule|scores|table|team> <league/team>', 'err');
            break;
          case 'games':
            if (args[0] === 'deals') await gameDeals();
            else add('Usage: games deals', 'err');
            break;
          case 'time':
            worldClock();
            break;
          case 'date':
            add(new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long',
                day: 'numeric' }), 'ok');
            break;
          case 'calc':
          case 'math':
            if (!args.length) { add('Usage: calc <expression>', 'err'); break; }
            try { var res = safeCalc(args.join(''));
              add(args.join('') + ' = ' + res, 'ok'); } catch { add(
                'Invalid expression. Use numbers and + - * / ( ).', 'err'); }
            break;
          case 'genpass':
            genPass(args[0] ? parseInt(args[0]) : 12);
            break;
          case 'reverse':
            if (!args.length) add('Usage: reverse <text>', 'err');
            else reverseText(args.join(' '));
            break;
          case 'upper':
            if (!args.length) add('Usage: upper <text>', 'err');
            else upperText(args.join(' '));
            break;
          case 'lower':
            if (!args.length) add('Usage: lower <text>', 'err');
            else lowerText(args.join(' '));
            break;
          case 'len':
            if (!args.length) add('Usage: len <text>', 'err');
            else lenText(args.join(' '));
            break;
          case 'echo':
            if (!args.length) add('Usage: echo <text>', 'err');
            else echoText(args.join(' '));
            break;
          case 'fact':
            await randomFact();
            break;
          case 'wiki':
            if (!args[0]) add('Usage: wiki <search term>', 'err');
            else await wikiSearch(args.join(' '));
            break;
          case 'define':
            if (!args[0]) add('Usage: define <word>', 'err');
            else await defineWord(args[0]);
            break;
          case 'qr':
            if (!args[0]) add('Usage: qr <text>', 'err');
            else qrCode(args.join(' '));
            break;
          case 'randomuser':
            await randomUser();
            break;
          case 'bored':
            await boredActivity();
            break;
          case 'catfact':
            await catFact();
            break;
          case 'dog':
            await dogImage();
            break;
          case 'reddit':
            await reddit(args[0] || 'all', args[1] || 5);
            break;
          case 'stocks':
            await stocks(args[0] || 'AAPL');
            break;
          case 'translate':
            if (args.length < 2) { add('Usage: translate <text> <target>', 'err'); } else { var target = args.pop();
              await translate(args.join(' '), target); }
            break;
          case 'fs':
            if (args[0] === 'ls' || args[0] === 'list') fsList();
            else if (args[0] === 'create' && args[1]) fsCreate(args[1], args.slice(2).join(' '));
            else if (args[0] === 'read' && args[1]) fsRead(args[1]);
            else if (args[0] === 'delete' && args[1]) fsDelete(args[1]);
            else if (args[0] === 'search' && args[1]) fsSearch(args[1]);
            else add('Usage: fs <ls|create|read|delete|search> ...', 'err');
            break;
          case 'vault':
            if (args[0] === 'setpass' && args[1]) vaultSetPassword(args[1]);
            else if (args[0] === 'unlock' && args[1]) vaultUnlock(args[1]);
            else if (args[0] === 'add' && args.slice(1).join(' ')) vaultAdd(args.slice(1).join(' '));
            else if (args[0] === 'list') vaultList();
            else if (args[0] === 'delete' && args[1]) vaultDelete(parseInt(args[1]));
            else if (args[0] === 'lock') vaultLock();
            else add('Usage: vault <setpass|unlock|add|list|delete|lock> [args]', 'err');
            break;
          case 'alias':
            if (args[0] === 'list') listAliases();
            else if (args[0] === 'remove' && args[1]) removeAlias(args[1]);
            else if (args.length >= 2) addAlias(args[0], args.slice(1).join(' '));
            else add('Usage: alias <name> <command> or alias list or alias remove <name>', 'err');
            break;
          case 'theme':
            if (args[0] && themes[args[0]]) { applyTheme(args[0]);
              add('Theme set to ' + args[0] + '.', 'ok'); } else add('Available: ' + Object.keys(themes)
              .join(', '), 'info');
            break;
          case 'cache':
            if (args[0] === 'clear') { cacheClear();
              add('Cache cleared.', 'ok'); } else add('Usage: cache clear', 'err');
            break;
          case 'clear':
            output.innerHTML = '';
            outputLines = [];
            add('Terminal cleared.', 'info');
            break;
          case 'about':
            add('<div class="block"><strong>Nexus Terminal Pro v4.4</strong><br>Professional command hub with real-time APIs, vault, tools, and more.<br>Marvic Studios UG</div>',
              'ok');
            break;
          default:
            add('Unknown command: ' + esc(main) + '. Type help.', 'err');
        }
      }

      // ============================================================
      //  EVENTS
      // ============================================================
      output.addEventListener('click', function(e) {
        var cmdEl = e.target.closest('.clickable-cmd');
        if (!cmdEl) return;
        var cmd = cmdEl.dataset.cmd;
        if (cmd) { input.value = cmd;
          input.focus(); }
      });

      execBtn.addEventListener('click', function() { execute(input.value);
        input.value = '';
        input.focus(); });
      input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { execute(input.value);
          input.value = ''; } });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--;
            input.value = history[histIdx]; } } else if (e.key === 'ArrowDown') { e.preventDefault(); if (
            histIdx < history.length - 1) { histIdx++;
            input.value = history[histIdx]; } else { histIdx = history.length;
            input.value = ''; } }
      });
      document.getElementById('clearBtn').addEventListener('click', function() { output.innerHTML = '';
        outputLines = [];
        add('Terminal cleared.', 'info'); });
      document.getElementById('settingsToggle').addEventListener('click', function() { settingsPanel.classList.toggle(
          'active'); });
      document.querySelector('.terminal').addEventListener('click', function(e) { if (e.target.tagName !== 'INPUT' &&
          e.target.tagName !== 'BUTTON') input.focus(); });
      document.addEventListener('keydown', function(e) { if (e.ctrlKey && e.key === 'l') { e.preventDefault();
          output.innerHTML = '';
          outputLines = [];
          add('Terminal cleared.', 'info'); } });
      themeSelect.addEventListener('change', function(e) { applyTheme(e.target.value); });
      fontSizeSlider.addEventListener('input', function(e) {
        document.documentElement.style.fontSize = e.target.value + 'px';
        document.getElementById('fontSizeValue').textContent = e.target.value + 'px';
        localStorage.setItem('nexus_fontSize', e.target.value);
      });
      aliasAddBtn.addEventListener('click', function() {
        var val = aliasInput.value.trim();
        if (!val) { add('Usage: alias <name> <command>', 'err'); return; }
        var parts = val.split('=');
        if (parts.length === 2) { addAlias(parts[0].trim(), parts[1].trim()); } else { add(
            'Format: alias=command (e.g. gs=git status)', 'err'); }
        aliasInput.value = '';
      });
      aliasInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') aliasAddBtn.click(); });

      // ============================================================
      //  DRAG & DROP
      // ============================================================
      var dragCounter = 0;
      var terminalEl = document.getElementById('app');
      terminalEl.addEventListener('dragenter', function(e) { e.preventDefault();
        dragCounter++;
        dropOverlay.classList.add('active'); });
      terminalEl.addEventListener('dragover', function(e) { e.preventDefault(); });
      terminalEl.addEventListener('dragleave', function(e) { e.preventDefault();
        dragCounter--;
        if (dragCounter === 0) dropOverlay.classList.remove('active'); });
      terminalEl.addEventListener('drop', function(e) {
        e.preventDefault();
        dragCounter = 0;
        dropOverlay.classList.remove('active');
        var files = e.dataTransfer.files;
        if (!files.length) return;
        for (var i = 0; i < files.length; i++) {
          var file = files[i];
          var reader = new FileReader();
          reader.onload = function(ev) {
            var name = fsSanitize(file.name);
            if (!name) { add('Invalid filename: ' + esc(file.name), 'err'); return; }
            var f = JSON.parse(localStorage.getItem('nexus_fs') || '{}');
            if (f[name]) { add('File "' + esc(name) + '" already exists. Use fs delete first.',
              'err'); return; }
            f[name] = ev.target.result;
            localStorage.setItem('nexus_fs', JSON.stringify(f));
            add('Uploaded "' + esc(name) + '" (' + ev.target.result.length + ' bytes).', 'ok');
          };
          reader.readAsText(file);
        }
      });

      // ============================================================
      //  INIT
      // ============================================================
      var savedTheme = localStorage.getItem('nexus_theme') || 'default';
      themeSelect.value = savedTheme;
      applyTheme(savedTheme);
      var savedFont = localStorage.getItem('nexus_fontSize') || '14';
      fontSizeSlider.value = savedFont;
      document.documentElement.style.fontSize = savedFont + 'px';
      document.getElementById('fontSizeValue').textContent = savedFont + 'px';
      add('<div class="block"><strong>Nexus Terminal Pro v4.4</strong><br>Type <span class="cmd">help</span> to see all commands.</div>',
        'ok');
      add('Ready.', 'info');
      updateQuickbar();
      input.focus();
    })();
  </script>
</body>
</html>
