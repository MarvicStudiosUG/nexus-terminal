                            ['FACT', 'fact'],
                            ['WIKI <term>', 'wiki'], ['DEFINE <word>', 'define'], ['QR <text>', 'qr'],
                            ['RANDOMUSER', 'randomuser'], ['BORED', 'bored'], ['CATFACT', 'catfact'],
                            ['DOG', 'dog'],
                            ['REDDIT <subreddit> [limit]', 'reddit'], ['STOCKS <symbol>', 'stocks'],
                            ['TRANSLATE <text> <target>', 'translate'],
                            ['FS ls|create|read|delete|search', 'fs'],
                            ['VAULT setpass|unlock|add|list|delete|lock', 'vault'],
                            ['ALIAS <name> <command>', 'alias'],
                            ['ALIAS list', 'alias list'], ['ALIAS remove <name>', 'alias remove'],
                            ['THEME <name>', 'theme'],
                            ['CACHE clear', 'cache clear'], ['CLEAR', 'clear'],
                            ['NICK <name>', 'nick'],
                            ['ROOM create [name] [description] [password]', 'room create'],
                            ['ROOM join <id> [password]', 'room join'],
                            ['ROOM leave', 'room leave'],
                            ['ROOM list', 'room list'],
                            ['ROOM search <query>', 'room search'],
                            ['ROOM info <id>', 'room info'],
                            ['ROOM users', 'room users'],
                            ['ROOM invite', 'room invite'],
                            ['ROOM delete', 'room delete'],
                            ['CHAT <message>', 'chat'],
                            ['ABOUT', 'about']
                        ];
                        cmds.forEach(function(item) {
                            add('<span class="clickable-cmd" data-cmd="' + esc(item[1]) + '">' + esc(item[0]) +
                                '</span>', 'info');
                        });
                        break;
                    case 'weather':
                        if (!args[0]) add('Usage: weather <city>', 'err');
                        else await weather(args.join(' '));
                        break;
                    case 'joke':
                        await joke(args[0] ? Math.min(parseInt(args[0]), 10) : 1);
                        break;
                    case 'crypto':
                        await crypto(args.join(',') || 'bitcoin,ethereum');
                        break;
                    case 'news':
                        await news();
                        break;
                    case 'ip':
                        await ipInfo();
                        break;
                    case 'dns':
                        if (!args[0]) add('Usage: dns <domain>', 'err');
                        else await dnsLookup(args[0]);
                        break;
                    case 'currency':
                        await currency(args[0] || 'USD', args[1] || 'EUR', args[2] ? parseFloat(args[2]) : 1);
                        break;
                    case 'github':
                        if (!args[0]) add('Usage: github <user>', 'err');
                        else await github(args[0]);
                        break;
                    case 'spacex':
                        await spacex();
                        break;
                    case 'quote':
                        await quote();
                        break;
                    case 'sports':
                        if (args[0] === 'schedule' && args[1]) await sportsSchedule(args.slice(1).join(' '));
                        else if (args[0] === 'scores' && args[1]) await sportsScores(args.slice(1).join(' '));
                        else if (args[0] === 'table' && args[1]) await sportsTable(args.slice(1).join(' '));
                        else if (args[0] === 'team' && args[1]) await sportsTeam(args.slice(1).join(' '));
                        else add('Usage: sports <schedule|scores|table|team> <league/team>', 'err');
                        break;
                    case 'games':
                        if (args[0] === 'deals') await gameDeals();
                        else add('Usage: games deals', 'err');
                        break;
                    case 'time':
                        worldClock();
                        break;
                    case 'date':
                        add(new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long',
                            day: 'numeric' }), 'ok');
                        break;
                    case 'calc':
                    case 'math':
                        if (!args.length) { add('Usage: calc <expression>', 'err'); break; }
                        try { const res = safeCalc(args.join(''));
                            add(args.join('') + ' = ' + res, 'ok'); } catch { add('Invalid expression.', 'err'); }
                        break;
                    case 'genpass':
                        genPass(args[0] ? parseInt(args[0]) : 12);
                        break;
                    case 'reverse':
                        if (!args.length) add('Usage: reverse <text>', 'err');
                        else reverseText(args.join(' '));
                        break;
                    case 'upper':
                        if (!args.length) add('Usage: upper <text>', 'err');
                        else upperText(args.join(' '));
                        break;
                    case 'lower':
                        if (!args.length) add('Usage: lower <text>', 'err');
                        else lowerText(args.join(' '));
                        break;
                    case 'len':
                        if (!args.length) add('Usage: len <text>', 'err');
                        else lenText(args.join(' '));
                        break;
                    case 'echo':
                        if (!args.length) add('Usage: echo <text>', 'err');
                        else echoText(args.join(' '));
                        break;
                    case 'fact':
                        await randomFact();
                        break;
                    case 'wiki':
                        if (!args[0]) add('Usage: wiki <search term>', 'err');
                        else await wikiSearch(args.join(' '));
                        break;
                    case 'define':
                        if (!args[0]) add('Usage: define <word>', 'err');
                        else await defineWord(args[0]);
                        break;
                    case 'qr':
                        if (!args[0]) add('Usage: qr <text>', 'err');
                        else qrCode(args.join(' '));
                        break;
                    case 'randomuser':
                        await randomUser();
                        break;
                    case 'bored':
                        await boredActivity();
                        break;
                    case 'catfact':
                        await catFact();
                        break;
                    case 'dog':
                        await dogImage();
                        break;
                    case 'reddit':
                        await reddit(args[0] || 'all', args[1] || 5);
                        break;
                    case 'stocks':
                        await stocks(args[0] || 'AAPL');
                        break;
                    case 'translate':
                        if (args.length < 2) { add('Usage: translate <text> <target>', 'err'); } else { const target =
                                args.pop();
                            await translate(args.join(' '), target); }
                        break;
                    case 'fs':
                        if (args[0] === 'ls' || args[0] === 'list') fsList();
                        else if (args[0] === 'create' && args[1]) fsCreate(args[1], args.slice(2).join(' '));
                        else if (args[0] === 'read' && args[1]) fsRead(args[1]);
                        else if (args[0] === 'delete' && args[1]) fsDelete(args[1]);
                        else if (args[0] === 'search' && args[1]) fsSearch(args[1]);
                        else add('Usage: fs <ls|create|read|delete|search> ...', 'err');
                        break;
                    case 'vault':
                        if (args[0] === 'setpass' && args[1]) vaultSetPassword(args[1]);
                        else if (args[0] === 'unlock' && args[1]) vaultUnlock(args[1]);
                        else if (args[0] === 'add' && args.slice(1).join(' ')) vaultAdd(args.slice(1).join(' '));
                        else if (args[0] === 'list') vaultList();
                        else if (args[0] === 'delete' && args[1]) vaultDelete(parseInt(args[1]));
                        else if (args[0] === 'lock') vaultLock();
                        else add('Usage: vault <setpass|unlock|add|list|delete|lock> [args]', 'err');
                        break;
                    case 'alias':
                        if (args[0] === 'list') listAliases();
                        else if (args[0] === 'remove' && args[1]) removeAlias(args[1]);
                        else if (args.length >= 2) addAlias(args[0], args.slice(1).join(' '));
                        else add('Usage: alias <name> <command> or alias list or alias remove <name>', 'err');
                        break;
                    case 'theme':
                        if (args[0] && themes[args[0]]) { applyTheme(args[0]);
                            add('Theme set to ' + args[0] + '.', 'ok'); } else add('Available: ' + Object.keys(themes)
                            .join(', '), 'info');
                        break;
                    case 'cache':
                        if (args[0] === 'clear') { cacheClear();
                            add('Cache cleared.', 'ok'); } else add('Usage: cache clear', 'err');
                        break;
                    case 'nick':
                        if (args.length === 0) { add('Usage: nick <name>', 'err'); break; }
                        myAlias = args.join(' ').trim();
                        if (currentRoomRef) {
                            currentRoomRef.get('presence').get(myUserId).put({ alias: myAlias, lastSeen: Date
                                    .now() });
                        }
                        add(`Nickname set to ${esc(myAlias)}.`, 'ok');
                        break;
                    case 'room':
                        if (args[0] === 'create') {
                            const name = args[1] || null;
                            const description = args[2] || null;
                            const password = args[3] || null;
                            await createRoom(name, description, password);
                        } else if (args[0] === 'join') {
                            const id = args[1];
                            const password = args[2] || null;
                            if (!id) { add('Usage: room join <id> [password]', 'err'); break; }
                            await joinRoom(id, password);
                        } else if (args[0] === 'leave') {
                            leaveRoom();
                        } else if (args[0] === 'list') {
                            await listAllRooms();
                        } else if (args[0] === 'search') {
                            await searchRooms(args.slice(1).join(' '));
                        } else if (args[0] === 'info') {
                            await getRoomInfo(args[1] || currentRoomId);
                        } else if (args[0] === 'users') {
                            if (!currentRoomId) { add('Not in a room.', 'err'); break; }
                            const users = Object.values(roomUsers).filter(u => u && u.alias);
                            if (users.length === 0) { add('No other users online.', 'info'); } else {
                                add('<strong>👥 Online users:</strong>', 'highlight');
                                users.forEach(u => add(`${esc(u.alias)}${u.role === 'admin' ? ' 👑' : ''}`, 'ok'));
                            }
                        } else if (args[0] === 'invite') {
                            getRoomInvite();
                        } else if (args[0] === 'delete') {
                            await deleteRoom();
                        } else {
                            add(
                                'Usage: room <create|join|leave|list|search|info|users|invite|delete> [args]',
                                'err');
                        }
                        break;
                    case 'chat':
                        if (args.length === 0) { add('Usage: chat <message>', 'err'); break; }
                        sendChatMessage(args.join(' '));
                        break;
                    case 'clear':
                        output.innerHTML = '';
                        outputLines = [];
                        add('Terminal cleared.', 'info');
                        break;
                    case 'about':
                        add(
                            '<div class="block"><strong>Nexus Terminal Pro v5.0</strong><br>Professional command hub with real-time APIs, vault, tools, and multiplayer collaboration with password protection and chat.<br>Marvic Studios UG</div>',
                            'ok');
                        break;
                    default:
                        add('Unknown command: ' + esc(main) +
                            '. Type <span class="clickable-cmd" data-cmd="help">help</span>.', 'err');
                }

                add = originalAdd;
                if (currentRoomId && capturedHTML && main !== 'chat' && main !== 'room') {
                    sendMessageToRoom(raw, capturedHTML);
                }
                updateRoomStatusDisplay();
            }

            // ============================================================
            //  EVENTS
            // ============================================================
            output.addEventListener('click', function(e) {
                const cmdEl = e.target.closest('.clickable-cmd');
                if (!cmdEl) return;
                const cmd = cmdEl.dataset.cmd;
                if (cmd) { input.value = cmd;
                    input.focus(); }
            });

            execBtn.addEventListener('click', function() { execute(input.value);
                input.value = '';
                input.focus(); });
            input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { execute(input.value);
                    input.value = ''; } });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx > 0) { histIdx--;
                        input.value = history[histIdx]; } } else if (e.key === 'ArrowDown') { e.preventDefault(); if (
                        histIdx < history.length - 1) { histIdx++;
                        input.value = history[histIdx]; } else { histIdx = history.length;
                        input.value = ''; } }
            });
            document.getElementById('clearBtn').addEventListener('click', function() { output.innerHTML = '';
                outputLines = [];
                add('Terminal cleared.', 'info'); });
            settingsToggle.addEventListener('click', function() { if (settingsPanel.classList.contains('active'))
                    closeSettings();
                else openSettings(); });
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', closeSettings);
            document.querySelector('.terminal').addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !e.target.closest(
                        '.settings-panel') && !e.target.closest('.clickable-cmd')) input.focus();
            });
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'l') { e.preventDefault();
                    output.innerHTML = '';
                    outputLines = [];
                    add('Terminal cleared.', 'info'); }
                if (e.key === 'Escape') closeSettings();
            });
            themeSelect.addEventListener('change', function(e) { applyTheme(e.target.value); });
            fontSizeSlider.addEventListener('input', function(e) { document.documentElement.style.fontSize = e.target
                    .value + 'px';
                document.getElementById('fontSizeValue').textContent = e.target.value + 'px';
                localStorage.setItem('nexus_fontSize', e.target.value); });
            aliasAddBtn.addEventListener('click', function() {
                const val = aliasInput.value.trim();
                if (!val) { add('Usage: alias <name> <command>', 'err'); return; }
                const parts = val.split('=');
                if (parts.length === 2) { addAlias(parts[0].trim(), parts[1].trim()); } else { add(
                        'Format: alias=command (e.g. gs=git status)', 'err'); }
                aliasInput.value = '';
            });
            aliasInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') aliasAddBtn.click(); });

            roomCreateBtn.addEventListener('click', function() {
                const name = roomNameInput.value.trim() || null;
                const desc = roomDescInput.value.trim() || null;
                const pass = roomCreatePassInput.value.trim() || null;
                createRoom(name, desc, pass);
            });
            roomJoinBtn.addEventListener('click', function() {
                const id = roomJoinInput.value.trim();
                const pass = roomJoinPassInput.value.trim();
                if (id) joinRoom(id, pass || null);
                else add('Enter a room ID.', 'err');
            });
            roomLeaveBtn.addEventListener('click', leaveRoom);
            roomDeleteBtn.addEventListener('click', deleteRoom);

            // Copy Room ID on badge click
            roomBadgeContainer.addEventListener('click', function() {
                if (!currentRoomId) return;
                copyToClipboard(currentRoomId).then(() => {
                    const tempSpan = document.createElement('span');
                    tempSpan.className = 'room-badge';
                    tempSpan.textContent = '✅ Copied!';
                    roomBadgeContainer.innerHTML = '';
                    roomBadgeContainer.appendChild(tempSpan);
                    setTimeout(() => updateRoomBadge(roomMeta), 1500);
                }).catch(() => {
                    add('Failed to copy room ID. Please copy manually: ' + esc(currentRoomId), 'err');
                });
            });

            // ============================================================
            //  DRAG & DROP
            // ============================================================
            let dragCounter = 0;
            const terminalEl = document.getElementById('app');
            terminalEl.addEventListener('dragenter', function(e) { e.preventDefault();
                dragCounter++;
                dropOverlay.classList.add('active'); });
            terminalEl.addEventListener('dragover', function(e) { e.preventDefault(); });
            terminalEl.addEventListener('dragleave', function(e) { e.preventDefault();
                dragCounter--; if (dragCounter === 0) dropOverlay.classList.remove('active'); });
            terminalEl.addEventListener('drop', function(e) {
                e.preventDefault();
                dragCounter = 0;
                dropOverlay.classList.remove('active');
                const files = e.dataTransfer.files;
                if (!files.length) return;
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const name = fsSanitize(file.name);
                        if (!name) { add('Invalid filename: ' + esc(file.name), 'err'); return; }
                        const f = JSON.parse(localStorage.getItem('nexus_fs') || '{}');
                        if (f[name]) { add('File "' + esc(name) + '" already exists.', 'err'); return; }
                        f[name] = ev.target.result;
                        localStorage.setItem('nexus_fs', JSON.stringify(f));
                        add('Uploaded "' + esc(name) + '" (' + ev.target.result.length + ' bytes).', 'ok');
                    };
                    reader.readAsText(file);
                }
            });

            // ============================================================
            //  INIT
            // ============================================================
            const savedTheme = localStorage.getItem('nexus_theme') || 'default';
            themeSelect.value = savedTheme;
            applyTheme(savedTheme);
            const savedFont = localStorage.getItem('nexus_fontSize') || '14';
            fontSizeSlider.value = savedFont;
            document.documentElement.style.fontSize = savedFont + 'px';
            document.getElementById('fontSizeValue').textContent = savedFont + 'px';

            const gunReady = initGun();
            if (gunReady) {
                add(
                    '⚡ Collaboration engine ready. Type <span class="clickable-cmd" data-cmd="help">help</span> to see room and chat commands.',
                    'info');
            }

            add(
                '<div class="block"><strong>🚀 Nexus Terminal Pro v5.0</strong><br>Type <span class="clickable-cmd" data-cmd="help">help</span> to see all commands. Room system improved!</div>',
                'ok');
            add('Ready.', 'info');
            input.focus();
            updateRoomStatusDisplay();
        })();
    </script>
</body>
    </html>
