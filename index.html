<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexus Terminal Pro | Marvic Studios UG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="terminal" id="app" role="application" aria-label="Nexus Terminal Pro">
    <div class="drop-overlay" id="dropOverlay" aria-label="Drop files to upload">DROP FILES HERE</div>

    <div class="header" role="banner">
      <div class="dots">
        <div class="dot red" aria-hidden="true"></div>
        <div class="dot yellow" aria-hidden="true"></div>
        <div class="dot green" aria-hidden="true"></div>
      </div>
      <div class="title" aria-label="Nexus Terminal Pro">NEXUS TERMINAL PRO</div>
      <div class="status" role="status" aria-live="polite">
        <span><span class="led" aria-hidden="true"></span> ONLINE</span>
        <span id="liveClock" aria-label="Current time">--:--:--</span>
        <button class="settings-btn" id="settingsToggle" aria-label="Open settings">Settings</button>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel" role="dialog" aria-label="Terminal settings">
      <div class="settings-section">
        <h3 id="themeLabel">Theme</h3>
        <select id="themeSelect" aria-labelledby="themeLabel">
          <option value="default">Cyber Neon</option>
          <option value="ocean">Deep Ocean</option>
          <option value="mono">Monochrome</option>
          <option value="matrix">Matrix</option>
          <option value="sunset">Sunset</option>
        </select>
      </div>
      <div class="settings-section">
        <h3 id="fontLabel">Font Size</h3>
        <input type="range" id="fontSizeSlider" min="11" max="18" value="14" aria-labelledby="fontLabel">
        <span id="fontSizeValue" style="color:var(--dim);">14px</span>
      </div>
      <div class="settings-section">
        <h3 id="aliasLabel">Command Aliases</h3>
        <input type="text" id="aliasInput" placeholder="alias=command" aria-labelledby="aliasLabel">
        <button id="aliasAddBtn">Add Alias</button>
      </div>
      <div class="settings-section">
        <h3 id="statsLabel">Session Stats</h3>
        <div style="font-size:0.7rem;color:var(--dim);" id="sessionStats" aria-labelledby="statsLabel"></div>
      </div>
      <div style="margin-top:1rem;font-size:0.7rem;color:var(--dim);text-align:center;">
        Nexus Terminal Pro v4.3<br>Marvic Studios UG
      </div>
    </div>

    <div class="body">
      <div class="output" id="outputContainer" role="log" aria-live="polite" aria-label="Terminal output"></div>
      <div class="quickbar" id="quickbar" role="toolbar" aria-label="Quick commands"></div>
      <div class="inputline" role="form" aria-label="Command input">
        <div class="prompt" aria-hidden="true"><span>></span></div>
        <input type="text" id="cmdInput" placeholder="type command..." autofocus autocomplete="off" spellcheck="false" aria-label="Command input">
        <div class="input-actions">
          <button class="icon-btn" id="clearBtn" title="Clear (Ctrl+L)" aria-label="Clear terminal">&#x2715;</button>
          <button id="execBtn" aria-label="Execute command">EXEC</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
